<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | TravelSmart</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body style="background: radial-gradient(ellipse at center, rgba(15, 23, 42, 0.95), #090d16);">

    <div class="auth-page">
        <div class="auth-card" style="max-width: 520px;">
            <!-- Back to Home Link -->
            <div style="margin-bottom: 18px;">
                <a href="/" style="display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--text-secondary);">
                    <span>←</span> Return to Home
                </a>
            </div>

            <div class="auth-header-center">
                <div class="auth-logo-badge">🌍</div>
                <h1 style="font-size:24px; font-weight:700;">Create Your Account</h1>
                <p>Join the next-generation smart travel ecosystem</p>
            </div>

            <form id="registerForm">
                <div class="form-group">
                    <label class="form-label" for="regName">Full Name</label>
                    <input 
                        type="text" 
                        class="form-input" 
                        id="regName" 
                        placeholder="e.g. Abhishek Rawat" 
                        required 
                        autocomplete="name"
                    >
                </div>

                <div class="form-group">
                    <label class="form-label" for="regEmail">Email Address</label>
                    <input 
                        type="email" 
                        class="form-input" 
                        id="regEmail" 
                        placeholder="yourname@domain.com" 
                        required 
                        autocomplete="email"
                    >
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="regPassword">Password</label>
                        <input 
                            type="password" 
                            class="form-input" 
                            id="regPassword" 
                            placeholder="Min 6 characters" 
                            required 
                            minlength="6"
                            autocomplete="new-password"
                        >
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="regPhone">Phone Number</label>
                        <input 
                            type="tel" 
                            class="form-input" 
                            id="regPhone" 
                            placeholder="+91 98765 43210"
                            autocomplete="tel"
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Select Your Account Role</label>
                    <div class="role-selector">
                        <div class="role-option selected" data-role="traveller">
                            <div class="icon">🧳</div>
                            <div class="label">Traveller</div>
                        </div>
                        <div class="role-option" data-role="provider">
                            <div class="icon">🏨</div>
                            <div class="label">Provider</div>
                        </div>
                        <div class="role-option" data-role="admin">
                            <div class="icon">⚙️</div>
                            <div class="label">Admin</div>
                        </div>
                    </div>
                    <input type="hidden" id="regRole" value="traveller">
                </div>

                <button type="submit" class="btn btn-primary w-full btn-lg" id="registerBtn" style="margin-top:10px;">
                    🚀 Create Free Account
                </button>
            </form>

            <p style="text-align:center; margin-top:20px; color: var(--text-secondary); font-size:13.5px;">
                Already registered? <a href="/pages/login.html" style="color:var(--primary-light); font-weight:600;">Sign In Here</a>
            </p>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="/js/app.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
