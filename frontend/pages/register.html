<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | TravelSmart</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card" style="max-width: 500px;">
            <div class="logo">
                <div class="icon">🌍</div>
                <h1>TravelSmart</h1>
                <p>Create your account to start traveling smart</p>
            </div>
            <form id="registerForm">
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-input" id="regName" placeholder="Your full name" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-input" id="regEmail" placeholder="your@email.com" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-input" id="regPassword" placeholder="Min 6 characters" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Phone</label>
                        <input type="tel" class="form-input" id="regPhone" placeholder="+91 XXXXX XXXXX">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Select Your Role</label>
                    <div class="role-selector">
                        <div class="role-option selected" data-role="traveller">
                            <div class="icon">🧳</div>
                            <div class="label">Traveller</div>
                        </div>
                        <div class="role-option" data-role="provider">
                            <div class="icon">🏨</div>
                            <div class="label">Service Provider</div>
                        </div>
                        <div class="role-option" data-role="admin">
                            <div class="icon">⚙️</div>
                            <div class="label">Admin</div>
                        </div>
                    </div>
                    <input type="hidden" id="regRole" value="traveller">
                </div>
                <button type="submit" class="btn btn-primary w-full btn-lg" id="registerBtn">
                    🚀 Create Account
                </button>
            </form>
            <p style="text-align:center; margin-top:20px; color: var(--text-secondary); font-size:14px;">
                Already have an account? <a href="/pages/login.html">Login here</a>
            </p>
        </div>
    </div>
    <div class="toast-container" id="toastContainer"></div>
    <script src="/js/app.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
