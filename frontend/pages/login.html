<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | TravelSmart</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body style="background: radial-gradient(ellipse at center, rgba(15, 23, 42, 0.95), #090d16);">

    <div class="auth-page">
        <div class="auth-card">
            <!-- Back to Home Link -->
            <div style="margin-bottom: 20px;">
                <a href="/" style="display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--text-secondary);">
                    <span>←</span> Return to Home
                </a>
            </div>

            <div class="auth-header-center">
                <div class="auth-logo-badge">🌍</div>
                <h1 style="font-size:24px; font-weight:700;">Welcome Back</h1>
                <p>Sign in to your TravelSmart ecosystem</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="loginEmail">Email Address</label>
                    <input 
                        type="email" 
                        class="form-input" 
                        id="loginEmail" 
                        placeholder="traveller@example.com" 
                        required 
                        autocomplete="email"
                    >
                </div>

                <div class="form-group">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                        <label class="form-label" for="loginPassword" style="margin-bottom:0;">Password</label>
                        <a href="#" onclick="alert('Password reset link will be sent to your registered email.'); return false;" style="font-size:12px; color:var(--primary-light);">
                            Forgot Password?
                        </a>
                    </div>
                    <input 
                        type="password" 
                        class="form-input" 
                        id="loginPassword" 
                        placeholder="••••••••" 
                        required 
                        autocomplete="current-password"
                    >
                </div>

                <button type="submit" class="btn btn-primary w-full btn-lg" id="loginBtn" style="margin-top:10px;">
                    🔐 Sign In
                </button>
            </form>

            <!-- Quick Demo Credentials Fill -->
            <div style="margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border-color); text-align:center;">
                <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 10px;">Quick Test Login:</p>
                <div style="display:flex; gap:8px; justify-content:center;">
                    <button 
                        type="button" 
                        class="btn btn-secondary btn-sm" 
                        onclick="document.getElementById('loginEmail').value='abhishek@travelsmart.com'; document.getElementById('loginPassword').value='travel2024'; showToast('Demo credentials filled!', 'info');"
                        style="font-size:11px; padding:6px 12px;"
                    >
                        👤 Traveler Demo
                    </button>
                    <button 
                        type="button" 
                        class="btn btn-secondary btn-sm" 
                        onclick="document.getElementById('loginEmail').value='admin@travelsmart.com'; document.getElementById('loginPassword').value='password123'; showToast('Admin credentials filled!', 'info');"
                        style="font-size:11px; padding:6px 12px;"
                    >
                        ⚙️ Admin Demo
                    </button>
                </div>
            </div>

            <p style="text-align:center; margin-top:20px; color: var(--text-secondary); font-size:13.5px;">
                Don't have an account? <a href="/pages/register.html" style="color:var(--primary-light); font-weight:600;">Create Account</a>
            </p>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="/js/app.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
