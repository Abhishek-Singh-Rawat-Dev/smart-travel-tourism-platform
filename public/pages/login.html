<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | TravelSmart</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="logo">
                <div class="icon">🌍</div>
                <h1>TravelSmart</h1>
                <p>Welcome back! Login to continue</p>
            </div>
            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-input" id="loginEmail" placeholder="your@email.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-input" id="loginPassword" placeholder="Enter password" required>
                </div>
                <button type="submit" class="btn btn-primary w-full btn-lg" id="loginBtn">
                    🔐 Login
                </button>
            </form>
            <p style="text-align:center; margin-top:20px; color: var(--text-secondary); font-size:14px;">
                Don't have an account? <a href="/pages/register.html">Register here</a>
            </p>
        </div>
    </div>
    <div class="toast-container" id="toastContainer"></div>
    <script src="/js/app.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
